[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fiducia-agents"
version = "1.0.0"
description = "Evidence-first, policy-governed fund approval with five bounded AI agents"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.50,<2",
  "pandas>=2.2,<4",
  "langgraph>=1.0,<2",
  "boto3>=1.40,<2",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "python-pptx>=1.0,<2"]
aws = ["bedrock-agentcore>=1.0,<2", "strands-agents>=1.0,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["fiducia*"]
